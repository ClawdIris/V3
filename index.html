      if (!confirmModal || !supabase || !driverId) return;
      setIsLoading(true);
      var ord = confirmModal.order;
      var typ = confirmModal.type;
      var prom = typ === "pickup" ? 
        ActivityLogService.logPickupConfirmed(supabase, ord.order_id, ord.id, driverId, ord.pickup_location).then(function() { return BoxOrdersService.updateOrderStatus(supabase, ord.id, STATUS_WORKFLOW.PICKED_UP); }) :
        ActivityLogService.logDropoffConfirmed(supabase, ord.order_id, ord.id, driverId).then(function() { return BoxOrdersService.updateOrderStatus(supabase, ord.id, STATUS_WORKFLOW.DROPPED_OFF); }).then(function() { setPaymentModal({ order: ord }); });
      
      prom.then(function() { setConfirmModal(null); return loadData(supabase, driverId); }).catch(function(e) { setError(e.message); }).finally(function() { setIsLoading(false); });
    };

    var handlePayment = function(pd) {
      if (!paymentModal || !supabase || !driverId) return;
      setIsLoading(true);
      var ord = paymentModal.order;
      StripePaymentService.recordPayment(supabase, ord.order_id, ord.id, driverId, pd.paymentMethod, parseFloat(pd.amount), pd.paymentLinkId)
        .then(function() { return StripePaymentService.generateReceipt(supabase, ord.order_id, ord.id, driverId, { payment_method: pd.paymentMethod, amount: parseFloat(pd.amount) }); })
        .then(function() { return BoxOrdersService.updateOrderStatus(supabase, ord.id, STATUS_WORKFLOW.COMPLETED); })
        .then(function() { setPaymentLinkDisplay(pd); setPaymentModal(null); return loadData(supabase, driverId); })
        .catch(function(e) { setError(e.message); })
        .finally(function() { setIsLoading(false); });
    };

    if (!driverId) {
      return React.createElement("div", { style: styles.container }, React.createElement("div", { style: styles.loadingMessage }, "Loading driver portal..."));
    }

    return React.createElement("div", { style: styles.container },
      React.createElement("div", { style: styles.header },
        React.createElement("h1", { style: styles.h1 }, "Driver Portal"),
        React.createElement("p", { style: styles.driverInfo }, "Driver ID: " + driverId)
      ),
      error && React.createElement("div", { style: styles.errorBox }, React.createElement("strong", null, "Error: "), error),
      React.createElement("div", { style: styles.mainContent },
        React.createElement("div", { style: styles.leftColumn },
          React.createElement(OrderTabs, {
            pickupOrders: pickupOrders,
            dropoffOrders: dropoffOrders,
            completedOrders: completedOrders,
            onConfirmPickup: function(o) { setConfirmModal({ order: o, action: "Pickup", type: "pickup" }); },
            onConfirmDropoff: function(o) { setConfirmModal({ order: o, action: "Dropoff", type: "dropoff" }); }
          })
        ),
        React.createElement("div", { style: styles.rightColumn },
          React.createElement(ActivityLogView, { activities: activities })
        )
      ),
      confirmModal && React.createElement(ConfirmationModal, { order: confirmModal.order, action: confirmModal.action, onConfirm: handleConfirm, onCancel: function() { setConfirmModal(null); }, isLoading: isLoading }),
      paymentModal && React.createElement(PaymentModal, { order: paymentModal.order, onPaymentComplete: handlePayment, onCancel: function() { setPaymentModal(null); }, isLoading: isLoading }),
      paymentLinkDisplay && React.createElement(PaymentLinkDisplay, { paymentData: paymentLinkDisplay, onClose: function() { setPaymentLinkDisplay(null); } })
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(DriverPortalApp));
})();
  </script>
</body>
</html>
