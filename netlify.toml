# netlify.toml — Casabe Konnect build configuration
#
# KEY STRATEGY (Jeffrey "Option A", 2026-06-29):
#   The Google Maps BROWSER key is committed directly into index.html as
#   `var GOOGLE_MAPS_KEY = "AIza..."`. It is safe to expose because it is
#   HTTP-referrer-locked to casabekonnect-app.netlify.app and restricted to
#   Maps JS + Places APIs. There is therefore NO build-time substitution.
#
#   (The old build command did `sed 's/%%GOOGLE_MAPS_KEY%%/$GOOGLE_MAPS_API_KEY/g'`
#    which was doubly broken: single-quoted $VAR never expands in sed, AND the
#    %%GOOGLE_MAPS_KEY%% placeholder no longer exists in index.html. A git-based
#    deploy running that could ship a broken key → white screen. Removed.)
#
#   Server-side keys (GOOGLE_ROUTES_API_KEY / GEOCODING) live in Supabase Edge
#   Function secrets ONLY — never here, never in index.html.
#
# DEPLOY GUARD: the build step now self-validates the committed key and FAILS
#   the build (non-zero exit) rather than publishing a broken/white-screen bundle.

[build]
  command = "bash ./scripts/netlify-build-guard.sh"
  publish = "."

[build.environment]
  NODE_VERSION = "18"
